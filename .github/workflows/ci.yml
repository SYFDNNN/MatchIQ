name: MatchIQ CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Validate UCL dataset
        run: python scripts/validate_ucl_dataset.py

      - name: Build runtime models
        run: python scripts/build_runtime_model.py --competition all

      - name: Evaluate UCL temporal holdout
        run: python scripts/evaluate_ucl_model.py

      - name: Run automated tests
        run: python -m pytest -q
