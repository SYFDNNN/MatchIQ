name: MatchIQ CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Validate UCL dataset
        run: python scripts/validate_ucl_dataset.py

      - name: Build UCL runtime model
        run: python scripts/build_runtime_model.py --competition ucl

      - name: Run automated tests
        run: >-
          python -m pytest -q
          tests/test_app.py::MatchIQAppTests::test_competition_registry_contract
          tests/test_app.py::MatchIQAppTests::test_ucl_team_catalog_and_prediction
          tests/test_app.py::MatchIQAppTests::test_invalid_competition_is_rejected
          tests/test_app.py::MatchIQAppTests::test_frontend_motion_and_team_option_contract
          tests/test_app.py::MatchIQAppTests::test_ucl_notebook_training_and_evaluation_contract
          tests/test_app.py::MatchIQAppTests::test_ucl_v4_audited_notebook_contract
          tests/test_ucl_v4.py
